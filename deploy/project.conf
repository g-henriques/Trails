# Project settings for the NAS scripts (committed; no secrets here).
# Per-NAS values (port, IP, image, keys) live in .env as NAS_* variables.
APP_NAME="trails"           # also the folder on the NAS: /share/Container/$APP_NAME
APP_SERVICE="app"           # docker compose service that serves HTTP
HEALTH_PATH="/healthz"      # must answer 200 without login
LOCAL_IMAGE="trails:local"  # NAS_IMAGE value that means "build on the NAS"
DEFAULT_PORT="8094"         # default host port (see the NAS inventory in the qnap-deploy skill)
GHCR_IMAGE="ghcr.io/g-henriques/trails"

# Data: none | sqlite | postgres
DATA_KIND="sqlite"
# sqlite: database path inside APP_SERVICE, uid the container runs as (owns the data folder)
SQLITE_PATH="/data/trails.db"
CONTAINER_UID="10001"
# postgres: compose service of the database
DB_SERVICE="db"
